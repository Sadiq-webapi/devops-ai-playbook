
name: Boutique CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS configuration
        shell: bash
        run: |
          set -euo pipefail

          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "AWS_ACCOUNT_ID must be a 12-digit AWS account ID."
            exit 1
          }

          test -n "$AWS_REGION" || {
            echo "AWS_REGION is missing."
            exit 1
          }

          aws sts get-caller-identity

      - name: Create ECR repository if missing
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          if aws ecr describe-repositories \
            --repository-names "$SERVICE" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ECR repository already exists: $SERVICE"
          else
            echo "Creating ECR repository: $SERVICE"
            aws ecr create-repository \
              --repository-name "$SERVICE" \
              --region "$AWS_REGION"
          fi

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build Docker Image
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          if [[ "$SERVICE" == "frontend" ]]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${SERVICE}"
          fi

          if [[ ! -d "$BUILD_PATH" ]]; then
            echo "Build directory not found: $BUILD_PATH"
            exit 1
          fi

          if [[ ! -f "$BUILD_PATH/Dockerfile" ]]; then
            echo "Dockerfile not found: $BUILD_PATH/Dockerfile"
            exit 1
          fi

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SERVICE}:${IMAGE_TAG}"

          echo "Building ${SERVICE}"
          docker build --tag "$IMAGE_URI" "$BUILD_PATH"

      - name: Push Docker Image
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SERVICE}:${IMAGE_TAG}"

          docker push "$IMAGE_URI"

  update-manifests:
    name: Update Kubernetes image tags
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in manifests
        shell: bash
        env:
          NEW_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          update_image() {
            local manifest="$1"
            local service="$2"

            if [[ ! -f "$manifest" ]]; then
              echo "Manifest not found: $manifest"
              exit 1
            fi

            if ! grep -Eq "^[[:space:]]*image:[[:space:]]*.*${service}:" "$manifest"; then
              echo "Image reference for ${service} not found in ${manifest}"
              exit 1
            fi

            sed -i -E \
              "s|(^[[:space:]]*image:[[:space:]]*).*/${service}:[^[:space:]]+|\\1${REGISTRY}/${service}:${NEW_TAG}|" \
              "$manifest"

            if grep -Eq '<AWS_ACCOUNT_ID>|AWS_ACCOUNT_ID' "$manifest"; then
              echo "Unresolved AWS account placeholder in ${manifest}"
              exit 1
            fi
          }

          for SERVICE in auth gateway orders order-service product-service user-service; do
            update_image "gitops/k8s/backend/${SERVICE}.yml" "$SERVICE"
          done

          update_image "gitops/k8s/frontend/deployment.yml" "frontend"

          echo "Updated image references:"
          grep -n 'image:' gitops/k8s/backend/*.yml gitops/k8s/frontend/deployment.yml

      - name: Commit and push updated manifests
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/k8s/

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "ci: update image tags to ${GITHUB_SHA}"
          git push origin HEAD:main
